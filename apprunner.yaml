version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --production
run:
  command: node server.js
  network:
    port: 3000
    env: PORT
  health-check:
    protocol: HTTP
    path: /api/health
    interval: 10
    timeout: 5
    healthy-threshold: 1
    unhealthy-threshold: 3
